 <div class="container mt-4">
  <h2>Modifier mes informations</h2>

  <form id="edit-form">
    <div class="form-group">
      <label for="firstName">Prénom</label>
      <input type="text" id="firstName" class="form-control" placeholder="Votre prénom">
    </div>

    <div class="form-group mt-3">
      <label for="email">Email</label>
      <input type="email" id="email" class="form-control" placeholder="Votre email">
    </div>

    <div class="form-group mt-3">
      <label for="password">Nouveau mot de passe</label>
      <input type="password" id="password" class="form-control" placeholder="Laisser vide si inchangé">
    </div>

    <button type="submit" id="btnEdit" class="btn btn-primary mt-4">Enregistrer les modifications</button>
  </form>
</div>
